name: Build Device Trees

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-26.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential device-tree-compiler reuse

      - name: Run Build
        run: |
          reuse lint-file src/arm/overlays/*
          make CC=gcc CROSS_COMPILE= all

