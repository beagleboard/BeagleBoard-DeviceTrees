%YAML 1.2
---
$id: http://devicetree.org/schemas/pci/airoha,en7581-pcie.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Gen3 PCIe controller on Airoha SoCs

maintainers:
  - Christian Marangi <ansuelsmth@gmail.com>

description: |+
  PCIe Gen3 MAC controller for Airoha SoCs, it supports Gen3 speed
  and compatible with Gen2, Gen1 speed.

  This PCIe controller supports up to 256 MSI vectors, the MSI hardware
  block diagram is as follows:

                    +-----+
                    | GIC |
                    +-----+
                       ^
                       |
                   port->irq
                       |
               +-+-+-+-+-+-+-+-+
               |0|1|2|3|4|5|6|7| (PCIe intc)
               +-+-+-+-+-+-+-+-+
                ^ ^           ^
                | |    ...    |
        +-------+ +------+    +-----------+
        |                |                |
  +-+-+---+--+--+  +-+-+---+--+--+  +-+-+---+--+--+
  |0|1|...|30|31|  |0|1|...|30|31|  |0|1|...|30|31| (MSI sets)
  +-+-+---+--+--+  +-+-+---+--+--+  +-+-+---+--+--+
   ^ ^      ^  ^    ^ ^      ^  ^    ^ ^      ^  ^
   | |      |  |    | |      |  |    | |      |  |  (MSI vectors)
   | |      |  |    | |      |  |    | |      |  |

    (MSI SET0)       (MSI SET1)  ...   (MSI SET7)

  With 256 MSI vectors supported, the MSI vectors are composed of 8 sets,
  each set has its own address for MSI message, and supports 32 MSI vectors
  to generate interrupt.

properties:
  compatible:
    const: airoha,en7581-pcie

  reg:
    minItems: 1
    maxItems: 2

  reg-names:
    minItems: 1
    maxItems: 2

  interrupts:
    maxItems: 1

  ranges:
    maxItems: 1

  resets:
    minItems: 1
    maxItems: 4

  reset-names:
    minItems: 1
    maxItems: 4

  clocks:
    maxItems: 1

  clock-names:
    items:
      - const: sys-ck

  phys:
    maxItems: 1

  phy-names:
    items:
      - const: pcie-phy

  num-lanes:
    enum: [1, 2]

  mediatek,pbus-csr:
    $ref: /schemas/types.yaml#/definitions/phandle-array
    items:
      - items:
          - description: phandle to pbus-csr syscon
          - description: offset of pbus-csr base address register
          - description: offset of pbus-csr base address mask register
    description:
      Phandle with two arguments to the syscon node used to detect if
      a given address is accessible on PCIe controller.

  airoha,scu:
    $ref: /schemas/types.yaml#/definitions/phandle-array
    items:
      - items:
          - description: phandle to airoha SCU syscon
    description:
      Phandle to SCU syscon to configure PCIe MUX for 2 lines support.

  '#interrupt-cells':
    const: 1

  interrupt-controller:
    description: Interrupt controller node for handling INTx PCI interrupts.
    type: object
    properties:
      '#address-cells':
        const: 0
      '#interrupt-cells':
        const: 1
      interrupt-controller: true

    required:
      - '#address-cells'
      - '#interrupt-cells'
      - interrupt-controller

    additionalProperties: false

required:
  - compatible
  - reg
  - reg-names
  - interrupts
  - ranges
  - clocks
  - clock-names
  - '#interrupt-cells'
  - interrupt-controller

allOf:
  - $ref: /schemas/pci/pci-host-bridge.yaml#
  - if:
      properties:
        num-lanes:
          const: 2
    then:
      properties:
        reg:
          minItems: 2

        reg-names:
          items:
            - const: pcie-mac
            - const: sec-pcie-mac

        resets:
          minItems: 4

        reset-names:
          items:
            - const: phy-lane0
            - const: phy-lane1
            - const: perstout
            - const: sec-perstout

      required:
        - airoha,scu

    else:
      properties:
        reg:
          maxItems: 1

        reg-names:
          items:
            - const: pcie-mac

        resets:
          minItems: 2
          maxItems: 3

        reset-names:
          minItems: 2
          items:
            - enum: [ phy-lane0, phy-lane1, phy-lane2 ]
            - enum: [ phy-lane1, perstout ]
            - const: phy-lane2

unevaluatedProperties: false

examples:
  - |
    #include <dt-bindings/interrupt-controller/arm-gic.h>
    #include <dt-bindings/interrupt-controller/irq.h>

    bus {
        #address-cells = <2>;
        #size-cells = <2>;

        pcie@1fc00000 {
            compatible = "airoha,en7581-pcie";
            device_type = "pci";
            #address-cells = <3>;
            #size-cells = <2>;

            reg = <0x0 0x1fc00000 0x0 0x1670>,
                  <0x0 0x1fc20000 0x0 0x1670>;
            reg-names = "pcie-mac", "sec-pcie-mac";

            clocks = <&scuclk 7>;
            clock-names = "sys-ck";

            phys = <&pciephy>;
            phy-names = "pcie-phy";

            ranges = <0x02000000 0 0x20000000 0x0 0x20000000 0 0x4000000>;

            resets = <&scuclk 48>,
                     <&scuclk 49>,
                     <&scuclk 53>,
                     <&scuclk 54>;
            reset-names = "phy-lane0", "phy-lane1",
                          "perstout", "sec-perstout";

            num-lanes = <2>;

            mediatek,pbus-csr = <&pbus_csr 0x0 0x4>;

            airoha,scu = <&scuclk>;

            interrupts = <GIC_SPI 39 IRQ_TYPE_LEVEL_HIGH>;
            bus-range = <0x00 0xff>;
            #interrupt-cells = <1>;
            interrupt-map-mask = <0 0 0 0x7>;
            interrupt-map = <0 0 0 1 &pcie_intc 0>,
                            <0 0 0 2 &pcie_intc 1>,
                            <0 0 0 3 &pcie_intc 2>,
                            <0 0 0 4 &pcie_intc 3>;
            pcie_intc: interrupt-controller {
                      #address-cells = <0>;
                      #interrupt-cells = <1>;
                      interrupt-controller;
            };
        };
    };
