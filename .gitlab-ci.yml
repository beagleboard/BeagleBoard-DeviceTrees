variables:
  GIT_STRATEGY: "clone"
  GIT_DEPTH: 1
  REGISTRY_BASE: "registry.gfnd.rcn-ee.org:5000/ci"

build-arm64:
  stage: build
  image: $REGISTRY_BASE/beagle-devscripts-kernel-debian-${DEBIAN_VERSION}-arm64:latest
  tags:
    - docker-aarch64
  parallel:
    matrix:
      - DEBIAN_VERSION: ["12", "13", "14"]
  script:
    - |
      if [ "$DEBIAN_VERSION" = "14" ]; then
        reuse lint-file src/arm/overlays/*
      fi
    - make CC=gcc CROSS_COMPILE= all
