name: Build Arm64

on:
  # This triggers on every push to EVERY branch
  push:
  
  # This triggers on every Pull Request targeting ANY branch
  pull_request:

  # This allows you to manually run it from the Actions tab
  workflow_dispatch:

jobs:
  build-arm64:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential device-tree-compiler

      - name: Run Build
        run: make CC=gcc CROSS_COMPILE= all